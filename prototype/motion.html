<!DOCTYPE html>
<meta charset="utf-8">
<title>Acquire — Motion Lab</title>
<link rel="stylesheet" href="components.css">
<style>
  html,body{height:auto;}
  body{margin:0; min-height:100%; overflow:visible; display:block;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#111827; background:#eef0f3;}
  header.cat{position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #e5e7eb; padding:12px 20px;}
  header.cat .proto-nav{position:absolute; top:12px; right:20px;}
  header.cat h1{font-size:15px; margin:0; font-weight:700;}
  header.cat p{margin:4px 0 0; font-size:12px; color:#6b7280;}
  .lab{padding:20px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;}
  .stage-frame{width:360px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; overflow:hidden;}
  .panel-mock{display:flex; flex-direction:column;}
  .panel-mock .stepstack{min-height:120px; display:flex; flex-direction:column; justify-content:flex-end; gap:12px; padding:14px 16px 8px;}
  .controls{width:320px; display:flex; flex-direction:column; gap:12px; font-size:13px;
    background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px;}
  .controls h2{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#374151; margin:0;}
  .controls .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .controls button{border:1px solid #d1d5db; background:#fff; border-radius:6px; padding:5px 12px; cursor:pointer; font:inherit;}
  .controls button.on{background:#2563eb; color:#fff; border-color:#2563eb;}
  .controls label{display:flex; align-items:center; gap:8px; color:#6b7280; justify-content:space-between;}
  .controls output, .controls select{font-variant-numeric:tabular-nums; color:#111827;}
  .controls textarea{width:100%; height:96px; font:11px ui-monospace,Menlo,monospace;}
  .controls .frames button{min-width:34px;}
  .hintline{font-size:11px; color:#9ca3af; margin:0;}
  /* the completed "→ result" that fades in at frame 3 */
  .res{display:inline-flex; align-items:center; gap:5px; margin-left:2px; font-size:14px; color:#4b5563;}
  /* recolor the selected tile hand→filled as it converges (lab viewport only) */
  .panel-mock .tile{transition:background-color var(--t1-dur,320ms) ease, border-color var(--t1-dur,320ms) ease, color var(--t1-dur,320ms) ease;}
</style>

<header class="cat">
  <nav class="proto-nav">
    <a href="index.html">Prototype</a>
    <a href="states.html">States</a>
    <a href="motion.html" aria-current="page">Motion</a>
  </nav>
  <h1>Motion lab</h1>
  <p>Tune the two transitions in isolation. Params live in <b>MOTION</b> (transitions.js) — copy the settled values back when done.</p>
</header>

<main class="lab">
  <div class="stage-frame"><div class="panel-mock" id="viewport"></div></div>
  <div class="controls" id="controls"></div>
</main>

<script src="components.js"></script>
<script src="transitions.js"></script>
<script>
function onBoardCellClick(){}   /* inert here */

const FIX_HAND = ["E6","E2","E10","G6","A12","I1"];
/* the "→ result" that fades in at frame 3 (empty = isolated placement, no arrow) */
const RESULT = {
  E6:  " → merger",
  E2:  " → grew "  + brand("Messla"),
  E10: " → grew "  + brand("ZuckFace"),
  G6:  " → Found startup",
  A12: "",
  I1:  "",
};
let current = "t1";   // "t1" (active→completed) | "t2" (push-up, decoupled)
const vp = document.getElementById("viewport");

/* ============================================================
   T1 — active → completed. Decoupled from the next step.
   Frame 1: place-active (clickable) · Frame 2: converged ·
   Frame 3: + arrow/result faded in.
   ============================================================ */
function t1Body(inner){ return activeStep({ label:"Place a tile", body:inner }); }

function renderT1(){   // Frame 1 — clickable
  vp.innerHTML = t1Body(
    `<div class="option-row" id="row">${FIX_HAND.map(c=>tile(c,{state:"hand",onclick:`selectTile('${c}')`})).join("")}</div>
     <div class="hint">Tap a tile to resolve.</div>`);
}
function renderT1Frame(n){   // static keyframe previews (default coord E6)
  const coord = "E6";
  if(n===1) return renderT1();
  if(n===2) vp.innerHTML = t1Body(`<div class="option-row">${tile(coord,{state:"filled"})}</div><div class="hint">Tap a tile to resolve.</div>`);
  if(n===3) vp.innerHTML = t1Body(`<div class="option-row">${tile(coord,{state:"filled"})}${RESULT[coord]?`<span class="res">${RESULT[coord]}</span>`:""}</div>`);
}

async function selectTile(coord){
  applyMotionVars();
  const row = document.getElementById("row");
  if(!row) return;
  const selEl = [...row.children].find(el=> el.getAttribute("title")===coord);
  if(!selEl) return;
  // Frame 1 → 2: selected recolors hand→filled + slides left; the rest converge behind and fade out
  selEl.classList.remove("t-hand"); selEl.classList.add("t-filled");
  await t1TileConverge(row, selEl);
  row.innerHTML = tile(coord,{state:"filled"});   // settle to the clean converged DOM
  // Frame 2 → 3: arrow + result fades and slides in (if this placement has one)
  const res = RESULT[coord];
  if(res){
    const span = document.createElement("span");
    span.className = "res"; span.innerHTML = res;
    row.appendChild(span);
    await runAnim(span, [
      { opacity:0, transform:"translateX(10px)" },
      { opacity:1, transform:"translateX(0)" },
    ], { duration: MOTION.t1.dur/MOTION.speed, easing: MOTION.t1.ease });
  }
}

/* ============================================================
   T2 — push-up reveal. Decoupled: does not depend on step contents.
   The current step rises up (into the log) as the next rises from below.
   ============================================================ */
function renderT2(){
  vp.innerHTML =
    `<div class="stepstack" id="logStack">${stepEntry({phase:"Place a tile", detail: tile("E6",{state:"filled"})+" → merger"})}</div>` +
    `<div id="slot">${activeStep({ label:"Found a startup", body:`<div class="hint">the current step</div>` })}</div>`;
}
async function playPushUp(){
  renderT2(); applyMotionVars();
  const slot = document.getElementById("slot");
  const active = slot.querySelector(".active-step");
  const holder = document.createElement("div");
  holder.innerHTML = activeStep({ label:"Buy shares (0/3)",
    body:`<div class="buy-grid">${["PaperfulPost","Messla","ZuckFace"].map(id=>stockCard(id,{mode:"select",price:300})).join("")}</div>` });
  const incoming = holder.firstElementChild;
  slot.appendChild(incoming);
  await stepAdvance(active, incoming);
  active.style.transform=""; document.getElementById("logStack").appendChild(active);   // becomes the log entry
  incoming.style.transform=""; incoming.style.opacity="";
}

/* ---- scrub: start the current transition paused, drive currentTime across it ---- */
let scrubAnims = [];
function startScrub(){
  applyMotionVars();
  if(current==="t1"){
    renderT1(); const row=document.getElementById("row");
    const sel=[...row.children].find(el=>el.getAttribute("title")==="E6")||row.children[0];
    sel.classList.remove("t-hand"); sel.classList.add("t-filled");
    t1TileConverge(row, sel);
  } else {
    renderT2(); const slot=document.getElementById("slot");
    const active=slot.querySelector(".active-step");
    const holder=document.createElement("div"); holder.innerHTML=activeStep({label:"Buy shares (0/3)", body:`<div class="buy-grid">${stockCard("Messla",{mode:"select",price:300})}</div>`});
    const incoming=holder.firstElementChild; slot.appendChild(incoming);
    stepAdvance(active, incoming);
  }
  scrubAnims = vp.getAnimations ? vp.getAnimations({subtree:true}) : [];
  scrubAnims.forEach(a=> a.pause());
}
function scrubTo(frac){
  const maxEnd = Math.max(1, ...scrubAnims.map(a=>{ const t=a.effect.getTiming(); return (t.delay||0)+(t.duration||0); }));
  scrubAnims.forEach(a=>{ a.currentTime = frac * maxEnd; });
}

/* ---- controls ---- */
function renderControls(){
  const c = document.getElementById("controls");
  const t1 = MOTION.t1, t2 = MOTION.t2;
  c.innerHTML = `
    <h2>Transition</h2>
    <div class="row" id="pick">
      <button data-t="t1" class="${current==="t1"?"on":""}">T1 · active → completed</button>
      <button data-t="t2" class="${current==="t2"?"on":""}">T2 · push-up</button>
    </div>
    <label>Speed <select id="speed">
      <option value="1"${MOTION.speed===1?" selected":""}>1×</option>
      <option value="0.5"${MOTION.speed===0.5?" selected":""}>0.5×</option>
      <option value="0.25"${MOTION.speed===0.25?" selected":""}>0.25×</option>
    </select></label>
    ${current==="t1" ? `
      <h2>Frames</h2>
      <div class="row frames"><button data-f="1">① active</button><button data-f="2">② converged</button><button data-f="3">③ completed</button></div>
      <p class="hintline">Click a tile in the panel to play ①→②→③.</p>
      <h2>T1 params</h2>
      <label>Duration <input type="range" id="t1dur" min="0" max="800" step="20" value="${t1.dur}"><output>${t1.dur}ms</output></label>
      <label>Tuck scale <input type="range" id="t1tuck" min="0.5" max="1" step="0.05" value="${t1.tuckScale}"><output>${t1.tuckScale}</output></label>
      <label>Stagger ms <input type="range" id="t1stag" min="0" max="120" step="5" value="${t1.stagger}"><output>${t1.stagger}</output></label>
    ` : `
      <div class="row"><button id="playBtn">▶ Play push-up</button></div>
      <h2>T2 params</h2>
      <label>Duration <input type="range" id="t2dur" min="0" max="800" step="20" value="${t2.dur}"><output>${t2.dur}ms</output></label>
      <label>Rise px <input type="range" id="t2rise" min="0" max="120" step="4" value="${t2.rise}"><output>${t2.rise}</output></label>
    `}
    <h2>Scrub</h2>
    <div class="row"><button id="scrubStart">Load frame</button></div>
    <label>t <input type="range" id="scrub" min="0" max="1" step="0.02" value="0" style="flex:1"></label>
    <h2>Tokens</h2>
    <textarea id="tokens" readonly></textarea>
    <button id="copyBtn">Copy MOTION</button>
  `;
  c.querySelectorAll("#pick button").forEach(b=> b.onclick=()=>{ current=b.dataset.t; renderControls(); enter(); });
  c.querySelectorAll(".frames button").forEach(b=> b.onclick=()=> renderT1Frame(parseInt(b.dataset.f,10)));
  const playBtn = c.querySelector("#playBtn"); if(playBtn) playBtn.onclick = playPushUp;
  c.querySelector("#speed").onchange = e=>{ MOTION.speed=parseFloat(e.target.value); refreshTokens(); };
  const bind = (id, apply)=>{ const el=c.querySelector("#"+id); if(!el) return;
    el.oninput=()=>{ apply(parseFloat(el.value)); el.nextElementSibling.textContent = el.value + (id.endsWith("dur")?"ms":""); refreshTokens(); }; };
  bind("t1dur", v=>MOTION.t1.dur=v); bind("t1tuck", v=>MOTION.t1.tuckScale=v); bind("t1stag", v=>MOTION.t1.stagger=v);
  bind("t2dur", v=>MOTION.t2.dur=v); bind("t2rise", v=>MOTION.t2.rise=v);
  c.querySelector("#scrubStart").onclick = ()=>{ startScrub(); c.querySelector("#scrub").value=0; };
  c.querySelector("#scrub").oninput = e=> scrubTo(parseFloat(e.target.value));
  c.querySelector("#copyBtn").onclick = ()=> navigator.clipboard && navigator.clipboard.writeText(c.querySelector("#tokens").value);
  refreshTokens();
}
function refreshTokens(){
  const t = document.querySelector("#tokens"); if(!t) return;
  t.value = "t1: " + JSON.stringify(MOTION.t1) + ",\nt2: " + JSON.stringify(MOTION.t2) + ",";
}
/* enter a mode: T1 waits at frame 1 for a click; T2 shows its start state */
function enter(){ if(current==="t1") renderT1(); else renderT2(); }

renderControls();
enter();
</script>
