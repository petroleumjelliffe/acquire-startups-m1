<title>Acquire — Layout Prototype</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#111827; background:#f9fafb;
    height:100dvh; overflow:hidden; display:grid; grid-template-rows:auto 1fr;
    font-size:14px; line-height:1.4;
  }
  button{font:inherit; color:inherit;}
  select{font:inherit; color:inherit;}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid #3b82f6; outline-offset:1px;}

  /* ---------- Header ---------- */
  .topbar{
    border-bottom:1px solid #e5e7eb; background:#fff;
    padding:8px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{font-weight:700; font-size:14px;}
  .field{display:flex; align-items:center; gap:4px; font-size:14px;}
  .field select{padding:2px 4px; border-radius:4px; border:1px solid #d1d5db; background:#fff;}
  .check-field{display:flex; align-items:center; gap:4px; font-size:14px; cursor:pointer;}
  .reset-btn{margin-left:auto; padding:4px 12px; border:1px solid #d1d5db; border-radius:4px; background:#fff; cursor:pointer; font-size:13px;}
  .reset-btn:hover{background:#f3f4f6;}

  /* ---------- Main layout ---------- */
  .main{overflow:hidden; position:relative;}
  .main.side{display:grid; grid-template-columns:1fr 320px;}
  .main.bottom{display:grid; grid-template-rows:1fr auto;}

  .board-wrap{overflow:hidden; display:flex; align-items:center; justify-content:center; padding:16px;}
  .board{
    display:grid; grid-template-columns:22px repeat(12,1fr); gap:1px;
    height:100%; max-width:100%; aspect-ratio:13/10;
  }
  .board .colhead, .board .rowhead{
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#4b5563;
  }
  .cell{
    position:relative; border:1px solid #d1d5db; font-size:11px; color:#374151;
    display:flex; align-items:center; justify-content:center; padding:0; background:#f3f4f6;
  }
  .cell.placed{background:#333333; color:#fff;}
  .cell.hand{
    cursor:pointer; background:#93c5fd; border:2px solid #3b82f6; color:#1e40af; font-weight:700; opacity:.85;
  }
  .cell.hand:hover{background:#60a5fa; opacity:1;}
  .cell.selected{outline:3px solid #2563eb; outline-offset:-3px; z-index:2;}
  .cell.founded .coord{opacity:0;}
  .cell.founded:hover .coord, .cell.founded:focus-visible .coord{opacity:1;}
  .cell .founder-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:rgba(255,255,255,0.6);
  }
  .cell .founder-label span{
    font-size:9px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:94%;
  }

  /* startup brand colors — exact match to src/styles/index.css */
  .brand-Gobble{background:#fecaca; border-color:#d90000; color:#991b1b;}
  .brand-Scrapple{background:#fed7aa; border-color:#e08e00; color:#9a3412;}
  .brand-PaperfulPost{background:#bbf7d0; border-color:#00e00f; color:#166534;}
  .brand-WrecksonMobil{background:#bfdbfe; border-color:#6790e7; color:#1e40af;}
  .brand-Messla{background:#fecdd3; border-color:#ffadaf; color:#9f1239;}
  .brand-CamCrooned{background:#f5d0fe; border-color:#e000ce; color:#86198f;}
  .brand-ZuckFace{background:#d1fae5; border-color:#87dba3; color:#065f46;}

  /* ---------- Panel ---------- */
  .panel{display:flex; flex-direction:column; gap:14px; padding:16px; overflow-y:auto;}
  .main.side .panel{border-left:1px solid #e5e7eb;}
  .main.bottom .panel{border-top:1px solid #e5e7eb; flex-direction:row; align-items:flex-start; gap:24px; max-height:38vh;}
  .main.bottom .panel > .players-block{flex:0 0 180px;}
  .main.bottom .panel > .stepstack{flex:0 0 170px;}
  .main.bottom .panel > .active-step{flex:1; min-width:260px;}

  .block-title{font-size:12px; color:#6b7280; font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;}

  /* players (roster now in sidebar) */
  .players-block{display:flex; flex-direction:column; gap:4px;}
  .player-row{
    display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px;
    border:1px solid #e5e7eb; font-size:13px; flex-wrap:wrap;
  }
  .player-row.active{border-color:#3b82f6; background:#eff6ff;}
  .player-dot{width:8px; height:8px; border-radius:50%; background:#22c55e; flex:none;}
  .player-row .nm{font-weight:600;}
  .player-row .turn-tag{font-size:10px; font-weight:700; text-transform:uppercase; color:#2563eb; letter-spacing:.03em;}
  .player-row .csh{margin-left:auto; color:#15803d; font-weight:600; font-variant-numeric:tabular-nums;}
  .player-row .chips{flex-basis:100%; display:flex; flex-wrap:wrap; gap:3px; margin-top:2px;}
  .chip{display:inline-block; font-size:11px; font-weight:600; padding:2px 6px; border-radius:4px; border:1px solid;}

  .stepstack{display:flex; flex-direction:column; gap:3px;}
  .step-done{font-size:12px; color:#4b5563;}
  .step-done b{color:#111827; font-weight:600;}

  .active-step{display:flex; flex-direction:column; gap:12px; font-size:14px; padding-top:10px; border-top:1px solid #e5e7eb;}
  .active-step p{margin:0;}
  .stage-label{font-size:12px; color:#6b7280; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}

  .option-row{display:flex; flex-wrap:wrap; gap:8px;}
  .option-card{border:1px solid; border-radius:4px; padding:4px 8px; font-size:14px; cursor:pointer; background:none; text-align:center;}
  .option-card.selected{outline:2px solid #2563eb; outline-offset:1px;}
  .option-card:disabled{opacity:.5; cursor:not-allowed;}
  .option-card .owned-badge{display:block; font-size:11px; font-weight:400; opacity:.75; margin-top:2px;}

  .primary-btn{background:#2563eb; color:#fff; border:none; border-radius:4px; padding:5px 14px; font-size:14px; cursor:pointer; align-self:flex-start;}
  .primary-btn:disabled{opacity:.5; cursor:not-allowed;}

  table.data{width:100%; font-size:12px; border-collapse:collapse;}
  table.data th{text-align:left; color:#4b5563; font-weight:600; padding:3px 6px; border-bottom:1px solid #e5e7eb;}
  table.data td{padding:3px 6px; border-bottom:1px solid #e5e7eb;}
  table.data th:not(:first-child), table.data td:not(:first-child){text-align:right;}
  .price-up{color:#15803d; font-weight:600;}

  .bonus-line{font-size:14px;}
  .bonus-line b{color:#15803d;}

  .staging{border:1.5px dashed #d1d5db; border-radius:4px; padding:8px; min-height:36px; display:flex; flex-wrap:wrap; gap:6px; align-items:flex-start;}
  .staging .empty{font-size:12px; color:#9ca3af; align-self:center;}
  .stage-pill{
    display:inline-flex; align-items:center; gap:4px; border-radius:9999px; padding:3px 5px 3px 10px;
    font-size:12px; font-weight:600; border:1px solid; cursor:pointer;
  }
  .stage-pill .x{width:14px; height:14px; border-radius:50%; background:rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; font-size:10px;}
  .buy-total{font-size:14px; font-weight:600;}

  .liq-piles{display:flex; gap:12px; flex-wrap:wrap;}
  .liq-pile{flex:1; min-width:130px;}
  .pile-header{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:4px;}
  .pile-add{width:22px; height:22px; border:1px solid #d1d5db; border-radius:4px; background:#fff; cursor:pointer; font-size:15px; line-height:1;}
  .pile-add:disabled{opacity:.4; cursor:not-allowed;}
  .hold-note{font-size:12px; color:#6b7280;}
  .receive-row{display:flex; gap:12px;}
  .receive-card{border:1px solid #d1d5db; border-radius:6px; padding:8px 12px; min-width:84px; text-align:center;}
  .receive-card.receive-cash{border-color:#86efac; background:#f0fdf4;}
  .receive-label{font-size:11px; text-transform:uppercase; letter-spacing:.03em; opacity:.75;}
  .receive-value{font-size:18px; font-weight:700;}
  .receive-cash .receive-value{color:#15803d;}

  ol.standings{margin:0; padding-left:20px;}
  ol.standings li{font-size:14px; padding:2px 0;}

  /* ---------- Pass-and-play overlay ---------- */
  .reveal-overlay{
    position:absolute; inset:0; background:rgba(255,255,255,0.96); z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  }
  .reveal-overlay .pass-name{font-size:18px; font-weight:700; color:#1f2937;}
  .reveal-overlay button{
    background:#2563eb; color:#fff; border:none; border-radius:8px; padding:12px 24px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .reveal-overlay button:hover{background:#1d4ed8;}
</style>

<div class="topbar">
  <div class="brand">Prototype</div>

  <label class="field">Layout:
    <select id="layoutSelect">
      <option value="side">Side panel</option>
      <option value="bottom">Bottom panel</option>
    </select>
  </label>

  <label class="check-field">
    <input type="checkbox" id="passPlayToggle" />
    Pass-and-play mode
  </label>

  <button class="reset-btn" id="resetBtn">↺ Reset turn</button>
</div>

<div class="main side" id="main">
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="panel" id="panel"></div>
</div>

<script>
/* ============================================================
   Static config
   ============================================================ */
const ROWS = "ABCDEFGHI".split("");
const COLS = Array.from({length:12},(_,i)=>i+1);

const STARTUPS = {
  Gobble:{tier:2}, Scrapple:{tier:2}, PaperfulPost:{tier:0}, CamCrooned:{tier:1},
  Messla:{tier:0}, ZuckFace:{tier:1}, WrecksonMobil:{tier:1},
};

const THRESHOLDS = [2,3,4,5,6,11,21,31,41];
const TIER_PRICES = [
  [200,300,400,500,600,700,800,900,1000],
  [300,400,500,600,700,800,900,1000,1100],
  [400,500,600,700,800,900,1000,1100,1200],
];
function priceIndexForSize(size){ let idx=0; for(let i=0;i<THRESHOLDS.length;i++) if(size>=THRESHOLDS[i]) idx=i; return idx; }
function sharePrice(tier,size){ return TIER_PRICES[tier][priceIndexForSize(size)]; }

/* orthogonal neighbours of a coord like "E10" */
function neighbors(coord){
  const r = coord[0], c = parseInt(coord.slice(1),10);
  const ri = ROWS.indexOf(r), out = [];
  if(ri>0) out.push(ROWS[ri-1]+c);
  if(ri<ROWS.length-1) out.push(ROWS[ri+1]+c);
  if(c>1) out.push(r+(c-1));
  if(c<12) out.push(r+(c+1));
  return out;
}

/* ============================================================
   Game state — a real, mutable single-turn machine
   ============================================================ */
let game, ui;

function makeStartups(){
  const s = {};
  Object.entries(STARTUPS).forEach(([id,info])=>{
    s[id] = {id, tier:info.tier, tiles:[], foundingTile:null, size:0, price:0, isFounded:false, availableShares:25};
  });
  return s;
}
function emptyBoard(){ const b={}; ROWS.forEach(r=>COLS.forEach(c=>{ b[r+c]={placed:false}; })); return b; }

function foundInit(g, id, tiles){
  const st = g.startups[id];
  tiles.forEach(t=> g.board[t] = {placed:true, startupId:id});
  st.tiles=[...tiles]; st.foundingTile=tiles[0]; st.size=tiles.length; st.isFounded=true;
  st.price = sharePrice(st.tier, st.size);
}

function initGame(){
  const g = {
    board: emptyBoard(),
    startups: makeStartups(),
    players: [
      {id:"p1", name:"Alex",   cash:4200, hand:["E6","E2","E10","G6","A12","I1"], portfolio:{Messla:4, ZuckFace:2}},
      {id:"p2", name:"Sam",    cash:5800, hand:[], portfolio:{Messla:2, ZuckFace:5}},
      {id:"p3", name:"Jordan", cash:3100, hand:[], portfolio:{Messla:3, ZuckFace:3}},
    ],
    activeIdx: 0,
    stage: "play",
    steps: [],
    placedTile: null,
    pendingFound: null,
    merger: null,
    cart: [],
    summary: null,
  };
  // Two equal chains with a mergeable gap at E6, plus a lone tile at G5.
  foundInit(g, "Messla",   ["E3","E4","E5"]);
  foundInit(g, "ZuckFace", ["E7","E8","E9"]);
  g.board["G5"] = {placed:true}; // lone unaffiliated tile → G6 can found next to it
  // available shares reflect what players already hold
  ["Messla","ZuckFace"].forEach(id=>{
    const held = g.players.reduce((n,p)=>n+(p.portfolio[id]||0),0);
    g.startups[id].availableShares = 25 - held;
  });

  game = g;
  ui = {
    layout: (ui && ui.layout) || "side",
    passPlay: (ui && ui.passPlay) || false,
    revealed: !((ui && ui.passPlay)),
    selectedTile: null,
    liqSell:0, liqTrade:0,
    survivorChoice:null, foundChoice:null,
  };
}

function activePlayer(){ return game.players[game.activeIdx]; }

/* ---------- absorb tiles into a chain, recompute size/price ---------- */
function absorbInto(id, tiles){
  const st = game.startups[id];
  st.isFounded = true;
  tiles.forEach(t=>{
    game.board[t] = {placed:true, startupId:id};
    if(!st.tiles.includes(t)) st.tiles.push(t);
  });
  if(!st.foundingTile) st.foundingTile = st.tiles[0];
  st.size = st.tiles.length;
  st.price = sharePrice(st.tier, st.size);
}

/* ============================================================
   Placement → transitions
   ============================================================ */
function placeTile(coord){
  const g = game;
  const adj = neighbors(coord).filter(n => g.board[n] && g.board[n].placed);
  const chains = [...new Set(adj.map(n=>g.board[n].startupId).filter(Boolean))];
  const loneAdj = adj.filter(n=> g.board[n].placed && !g.board[n].startupId);

  g.board[coord] = {placed:true};
  g.placedTile = coord;
  ui.selectedTile = null;
  // remove from hand
  const p = activePlayer();
  p.hand = p.hand.filter(h=>h!==coord);

  if(chains.length >= 2){
    startMerger(coord, chains, loneAdj);
  } else if(chains.length === 1){
    absorbInto(chains[0], [coord, ...loneAdj]);
    g.steps.push({lbl:"Placed", detail:`${coord} → grew ${chains[0]}`});
    g.stage = "buy";
  } else if(loneAdj.length >= 1){
    g.pendingFound = {tiles:[coord, ...loneAdj]};
    g.steps.push({lbl:"Placed", detail:coord});
    g.stage = "foundStartup";
  } else {
    g.steps.push({lbl:"Placed", detail:`${coord} (isolated)`});
    g.stage = "buy";
  }
}

/* ---------- found ---------- */
function chooseFoundBrand(id){
  const g = game;
  absorbInto(id, g.pendingFound.tiles);
  const p = activePlayer();
  p.portfolio[id] = (p.portfolio[id]||0) + 1;      // founder's free share
  g.startups[id].availableShares -= 1;
  g.steps.push({lbl:"Founded", detail:`${id} (+1 free share)`});
  g.pendingFound = null;
  ui.foundChoice = null;
  g.stage = "buy";
}

/* ---------- merger ---------- */
function startMerger(coord, chains, loneAdj){
  const g = game;
  const sizes = chains.map(id=>({id, size:g.startups[id].size}));
  const maxSize = Math.max(...sizes.map(s=>s.size));
  const largest = sizes.filter(s=>s.size===maxSize).map(s=>s.id);
  g.merger = { chains, coord, loneAdj, tied: largest.length>1 ? largest : null };
  g.steps.push({lbl:"Placed", detail:`${coord} → merger`});
  if(largest.length > 1){
    g.stage = "chooseSurvivor";
  } else {
    finalizeSurvivor(largest[0]);
  }
}
function finalizeSurvivor(survivorId){
  const g = game, m = g.merger;
  m.survivorId = survivorId;
  m.absorbedIds = m.chains.filter(id=>id!==survivorId);
  m.absorbedPrices = {};
  m.absorbedIds.forEach(id=> m.absorbedPrices[id] = g.startups[id].price);
  m.bonuses = computeBonuses(m.absorbedIds);
  g.steps.push({lbl:"Survivor", detail:survivorId});
  ui.survivorChoice = null;
  g.stage = "mergerPayout";
}
function computeBonuses(absorbedIds){
  const out = [];
  absorbedIds.forEach(id=>{
    const price = game.startups[id].price;
    const holders = game.players.map(p=>({name:p.name, shares:p.portfolio[id]||0}))
      .filter(h=>h.shares>0).sort((a,b)=>b.shares-a.shares);
    if(!holders.length) return;
    const top = holders[0].shares;
    const maj = holders.filter(h=>h.shares===top);
    if(maj.length>1){
      const each = Math.round((price*10+price*5)/maj.length/100)*100;
      maj.forEach(h=> out.push({absorbed:id, player:h.name, type:"majority", amount:each}));
    } else {
      out.push({absorbed:id, player:maj[0].name, type:"majority", amount:price*10});
      const rest = holders.filter(h=>h.shares<top);
      if(rest.length){
        const min = rest[0].shares;
        const minH = rest.filter(h=>h.shares===min);
        const each = minH.length>1 ? Math.round(price*5/minH.length/100)*100 : price*5;
        minH.forEach(h=> out.push({absorbed:id, player:h.name, type:"minority", amount:each}));
      }
    }
  });
  return out;
}
function finalizePayout(){
  const g = game, m = g.merger;
  m.bonuses.forEach(b=>{ const p=g.players.find(x=>x.name===b.player); if(p) p.cash += b.amount; });
  g.steps.push({lbl:"Payout", detail:m.bonuses.map(b=>`${b.player} +$${b.amount}`).join(' · ') || "no shareholders"});
  setupLiquidation();
}
function setupLiquidation(){
  const g = game, m = g.merger, p = activePlayer();
  const target = m.absorbedIds.find(id => (p.portfolio[id]||0) > 0);
  if(target){
    m.liq = {playerId:p.id, absorbedId:target};
    ui.liqSell=0; ui.liqTrade=0;
    g.stage = "mergerLiquidation";
  } else {
    completeMerger();
  }
}
function confirmLiquidation(){
  const g = game, m = g.merger, liq = m.liq;
  const p = g.players.find(x=>x.id===liq.playerId);
  const price = m.absorbedPrices[liq.absorbedId];
  const owned = p.portfolio[liq.absorbedId]||0;
  const sold = ui.liqSell, traded = ui.liqTrade, converted = Math.floor(traded/2);
  p.cash += sold*price;
  p.portfolio[liq.absorbedId] = owned - sold - traded;
  p.portfolio[m.survivorId] = (p.portfolio[m.survivorId]||0) + converted;
  g.startups[m.survivorId].availableShares -= converted;
  g.steps.push({lbl:"Liquidated", detail:`${p.name}: sold ${sold}, traded ${traded} of ${liq.absorbedId}`});
  completeMerger();
}
function completeMerger(){
  const g = game, m = g.merger;
  const allTiles = [m.coord, ...m.loneAdj];
  m.absorbedIds.forEach(id=>{
    allTiles.push(...g.startups[id].tiles);
    g.startups[id].isFounded = false; g.startups[id].tiles = []; g.startups[id].size = 0;
  });
  absorbInto(m.survivorId, allTiles);
  g.stage = "buy";
}

/* ---------- buy / end turn ---------- */
function buyableStartups(){
  return Object.values(game.startups).filter(s=>s.isFounded && s.availableShares>0)
    .map(s=>({id:s.id, price:s.price}));
}
function endTurn(){
  const g = game, p = activePlayer();
  g.cart.forEach(it=>{ p.cash -= it.price; p.portfolio[it.id]=(p.portfolio[it.id]||0)+1; g.startups[it.id].availableShares -= 1; });
  g.summary = {
    player: p.name,
    steps: g.steps.slice(),
    bought: g.cart.slice(),
  };
  g.stage = "turnComplete";
}

/* ============================================================
   Rendering
   ============================================================ */
function renderBoard(){
  const g = game;
  const hand = (g.stage==="play" && ui.revealed) ? activePlayer().hand : [];
  let html = `<div></div>`;
  COLS.forEach(c => html += `<div class="colhead">${c}</div>`);
  ROWS.forEach(r => {
    html += `<div class="rowhead">${r}</div>`;
    COLS.forEach(c => {
      const id = r+c;
      const cell = g.board[id];
      const startup = cell.startupId ? g.startups[cell.startupId] : null;
      const founded = !!(startup && startup.isFounded);
      const inHand = hand.includes(id) && !cell.placed;
      const selected = ui.selectedTile === id;
      const classes = ["cell"];
      if(cell.placed) classes.push("placed");
      if(founded) classes.push("founded", `brand-${cell.startupId}`);
      if(inHand) classes.push("hand");
      if(selected) classes.push("selected");
      const clickable = inHand || selected;
      html += `<button class="${classes.join(' ')}" ${clickable? `onclick="onBoardCellClick('${id}')"` : 'tabindex="-1"'} title="${id}">
        <span class="coord">${id}</span>
        ${founded && id===startup.foundingTile ? `<div class="founder-label"><span>${cell.startupId}</span></div>` : ''}
      </button>`;
    });
  });
  document.getElementById("board").innerHTML = html;
}
function onBoardCellClick(coord){
  if(game.stage!=="play") return;
  ui.selectedTile = (ui.selectedTile===coord)?null:coord;
  render();
}
function onConfirmPlacement(){
  if(!ui.selectedTile) return;
  placeTile(ui.selectedTile);
  render();
}

function chipsFor(portfolio){
  const entries = Object.entries(portfolio).filter(([,n])=>n>0);
  if(!entries.length) return `<span class="chip" style="border-color:#e5e7eb;color:#9ca3af;">no shares</span>`;
  return entries.map(([id,n])=>`<span class="chip brand-${id}">${id} ×${n}</span>`).join('');
}
function playersHtml(){
  const g = game, ap = activePlayer();
  return `<div class="players-block">
    <div class="block-title">Players</div>
    ${g.players.map(p=>{
      const isActive = p.id===ap.id;
      return `<div class="player-row ${isActive?'active':''}">
        <span class="player-dot"></span>
        <span class="nm">${p.name}</span>
        ${isActive?'<span class="turn-tag">turn</span>':''}
        <span class="csh">$${p.cash.toLocaleString()}</span>
        ${isActive?`<span class="chips">${chipsFor(p.portfolio)}</span>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

function stepStackHtml(){
  const g = game;
  if(!g.steps.length) return '';
  return `<div class="stepstack">
    <div class="block-title">This turn</div>
    ${g.steps.map(s=>`<div class="step-done">✓ <b>${s.lbl}:</b> ${s.detail}</div>`).join('')}
  </div>`;
}

function capTableHtml(ids){
  return `<table class="data">
    <thead><tr><th>Player</th>${ids.map(id=>`<th>${id}</th>`).join('')}</tr></thead>
    <tbody>${game.players.map(p=>`<tr><td>${p.name}</td>${ids.map(id=>`<td>${p.portfolio[id]||0}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function activeStepHtml(){
  const g = game, ap = activePlayer();

  if(g.stage==="play"){
    return `<div class="active-step">
      <div class="stage-label">Your turn — place a tile</div>
      <p>Pick a tile from your hand (or tap its highlighted cell), then confirm.</p>
      <div class="option-row">
        ${ap.hand.map(c=>`<button class="option-card ${ui.selectedTile===c?'selected':''}" style="border-color:#3b82f6; color:#1d4ed8;" onclick="onBoardCellClick('${c}')">${c}</button>`).join('')}
      </div>
      <button class="primary-btn" ${!ui.selectedTile?'disabled':''} onclick="onConfirmPlacement()">Confirm placement</button>
    </div>`;
  }

  if(g.stage==="foundStartup"){
    const available = Object.values(g.startups).filter(s=>!s.isFounded).map(s=>s.id);
    return `<div class="active-step">
      <div class="stage-label">Found a startup</div>
      <p>Tile ${g.pendingFound.tiles[0]} starts a new chain. Choose a brand:</p>
      <div class="option-row">
        ${available.map(id=>`<button class="option-card brand-${id} ${ui.foundChoice===id?'selected':''}" onclick="ui.foundChoice='${id}'; render();">${id}</button>`).join('')}
      </div>
      <button class="primary-btn" ${!ui.foundChoice?'disabled':''} onclick="chooseFoundBrand(ui.foundChoice); render();">Found &amp; continue</button>
    </div>`;
  }

  if(g.stage==="chooseSurvivor"){
    const tied = g.merger.tied;
    const totalSize = tied.reduce((sum,id)=>sum+g.startups[id].size,0) + 1;
    return `<div class="active-step">
      <div class="stage-label">Merger tie — choose survivor</div>
      <div class="option-row">
        ${tied.map(id=>`<button class="option-card brand-${id} ${ui.survivorChoice===id?'selected':''}" onclick="ui.survivorChoice='${id}'; render();">${id} (${g.startups[id].size})<span class="owned-badge">you own ${ap.portfolio[id]||0}</span></button>`).join('')}
      </div>
      <div>
        <div class="block-title">Winner's future share price</div>
        <table class="data">
          <thead><tr><th>If survivor</th><th>Size</th><th>Price</th></tr></thead>
          <tbody>
            ${tied.map(id=>{
              const st=g.startups[id]; const np=sharePrice(st.tier,totalSize); const sel=ui.survivorChoice===id;
              return `<tr${sel?' style="font-weight:600; background:#eff6ff;"':''}><td>${id}</td><td>${st.size} → ${totalSize}</td><td>$${st.price} → <span class="price-up">$${np}</span></td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <button class="primary-btn" ${!ui.survivorChoice?'disabled':''} onclick="finalizeSurvivor(ui.survivorChoice); render();">Confirm survivor</button>
    </div>`;
  }

  if(g.stage==="mergerPayout"){
    const m = g.merger;
    return `<div class="active-step">
      <div class="stage-label">Merger payout</div>
      <p>${m.absorbedIds.join(', ')} merged into <b>${m.survivorId}</b>.</p>
      ${m.bonuses.length ? m.bonuses.map(b=>`<div class="bonus-line">${b.type==='majority'?'Majority':'Minority'}: ${b.player} <b>+$${b.amount.toLocaleString()}</b></div>`).join('') : '<p>No shareholders to pay.</p>'}
      ${capTableHtml(m.absorbedIds)}
      <button class="primary-btn" onclick="finalizePayout(); render();">Continue</button>
    </div>`;
  }

  if(g.stage==="mergerLiquidation"){
    const m = g.merger, liq = m.liq;
    const p = g.players.find(x=>x.id===liq.playerId);
    const owned = p.portfolio[liq.absorbedId]||0;
    const held = owned - ui.liqTrade - ui.liqSell;
    const price = m.absorbedPrices[liq.absorbedId];
    const cash = ui.liqSell*price, converted = Math.floor(ui.liqTrade/2), unpaired = ui.liqTrade%2;
    const short = liq.absorbedId.slice(0,4);
    const pills = (count,dec)=> count
      ? Array.from({length:count}).map(()=>`<button class="stage-pill brand-${liq.absorbedId}" onclick="${dec}">${short}<span class="x">×</span></button>`).join('')
      : `<span class="empty">tap +</span>`;
    return `<div class="active-step">
      <div class="stage-label">Liquidate ${liq.absorbedId}</div>
      <p>${p.name}, you own <b>${owned}</b> shares of ${liq.absorbedId}. Sort them into piles:</p>
      <div class="liq-piles">
        <div class="liq-pile">
          <div class="pile-header"><span>Sell @ $${price}</span>
            <button class="pile-add" ${held<=0?'disabled':''} onclick="ui.liqSell++; render();">+</button></div>
          <div class="staging">${pills(ui.liqSell,'ui.liqSell--; render();')}</div>
        </div>
        <div class="liq-pile">
          <div class="pile-header"><span>Trade 2:1 → ${m.survivorId}</span>
            <button class="pile-add" ${held<=0?'disabled':''} onclick="ui.liqTrade++; render();">+</button></div>
          <div class="staging">${pills(ui.liqTrade,'ui.liqTrade--; render();')}</div>
        </div>
      </div>
      <div class="hold-note">Holding ${held} — unsorted shares stay in your portfolio.${unpaired?` <b>1 in the trade pile is unpaired.</b>`:''}</div>
      <div class="block-title" style="margin-bottom:0;">You'll receive</div>
      <div class="receive-row">
        <div class="receive-card receive-cash"><div class="receive-label">Cash</div><div class="receive-value">$${cash.toLocaleString()}</div></div>
        <div class="receive-card brand-${m.survivorId}"><div class="receive-label">${m.survivorId}</div><div class="receive-value">×${converted}</div></div>
      </div>
      <button class="primary-btn" onclick="confirmLiquidation(); render();">Confirm</button>
    </div>`;
  }

  if(g.stage==="buy"){
    const buyable = buyableStartups();
    const total = g.cart.reduce((s,it)=>s+it.price,0);
    const remaining = ap.cash - total;
    return `<div class="active-step">
      <div class="stage-label">Buy shares (${g.cart.length}/3)</div>
      <div class="option-row">
        ${buyable.map(b=>{
          const disabled = g.cart.length>=3 || b.price>remaining;
          return `<button class="option-card brand-${b.id}" ${disabled?'disabled':''} onclick="onAddToCart('${b.id}', ${b.price}); render();">${b.id} $${b.price}</button>`;
        }).join('') || '<span class="hold-note">No shares available to buy.</span>'}
      </div>
      <div class="staging">
        ${g.cart.length ? g.cart.map((it,i)=>`<button class="stage-pill brand-${it.id}" onclick="onRemoveFromCart(${i}); render();">${it.id}<span class="x">×</span></button>`).join('')
                        : `<span class="empty">Tap a share above to add it here</span>`}
      </div>
      <div class="buy-total">Total: $${total.toLocaleString()} &nbsp;·&nbsp; Cash after: $${remaining.toLocaleString()}</div>
      <button class="primary-btn" onclick="endTurn(); render();">${g.cart.length?'Buy &amp; end turn':'Skip &amp; end turn'}</button>
    </div>`;
  }

  if(g.stage==="turnComplete"){
    const sm = g.summary;
    return `<div class="active-step">
      <div class="stage-label">Turn complete — ${sm.player}</div>
      <div class="stepstack">
        ${sm.steps.map(s=>`<div class="step-done">✓ <b>${s.lbl}:</b> ${s.detail}</div>`).join('')}
        ${sm.bought.length ? `<div class="step-done">✓ <b>Bought:</b> ${sm.bought.map(b=>b.id).join(', ')}</div>` : `<div class="step-done">✓ <b>Bought:</b> nothing</div>`}
      </div>
      <button class="primary-btn" onclick="startTurn()">Start new turn</button>
    </div>`;
  }

  return '';
}

function onAddToCart(id, price){ if(game.cart.length>=3) return; game.cart.push({id,price}); }
function onRemoveFromCart(i){ game.cart.splice(i,1); }

function renderPanel(){
  document.getElementById("panel").innerHTML = `${playersHtml()}${stepStackHtml()}${activeStepHtml()}`;
}

function renderOverlay(){
  const main = document.getElementById("main");
  const existing = main.querySelector(".reveal-overlay");
  if(existing) existing.remove();
  if(ui.passPlay && !ui.revealed && game.stage==="play"){
    const ap = activePlayer();
    const div = document.createElement("div");
    div.className = "reveal-overlay";
    div.innerHTML = `<div class="pass-name">Pass to ${ap.name}</div>
      <button onclick="ui.revealed=true; render();">I'm ${ap.name} — Reveal</button>`;
    main.appendChild(div);
  }
}

function render(){
  const main = document.getElementById("main");
  main.className = "main " + ui.layout;
  document.getElementById("layoutSelect").value = ui.layout;
  document.getElementById("passPlayToggle").checked = ui.passPlay;
  renderBoard();
  renderPanel();
  renderOverlay();
}

/* ---------- turn lifecycle ---------- */
function startTurn(){
  initGame();               // fresh identical turn (Alex) for repeatable demo
  render();
}

/* ---------- controls ---------- */
document.getElementById("layoutSelect").addEventListener("change", e=>{ ui.layout = e.target.value; render(); });
document.getElementById("passPlayToggle").addEventListener("change", e=>{
  ui.passPlay = e.target.checked;
  ui.revealed = !(ui.passPlay && game.stage==="play");
  render();
});
document.getElementById("resetBtn").addEventListener("click", ()=> startTurn());

initGame();
render();
</script>
